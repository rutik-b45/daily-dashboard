<section class="layout">
  <nav class="sidebar">
    <div class="dashboard-title">Daily Dashboard</div>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <i class="fas fa-home"></i> Dashboard
    </a>
    <a routerLink="/weather" routerLinkActive="active">
      <i class="fas fa-cloud-sun"></i> Weather
    </a>
    <a routerLink="/news" routerLinkActive="active">
      <i class="fas fa-newspaper"></i> News
    </a>
    <a routerLink="/notes" routerLinkActive="active">
      <i class="fas fa-sticky-note"></i> Notes
    </a>
    <a routerLink="/saved" routerLinkActive="active">
      <i class="fas fa-bookmark"></i> Saved
    </a>
  </nav>

  <main class="main-content">
    <div class="children-title">{{currentTitle}}</div>
    <div class="divider"></div>
    <div class="children">
      <router-outlet></router-outlet>
    </div>
  </main>
</section>
