<div class="container" *ngIf="note">
<div class="edit-note-container">
    <h2>Edit Note</h2>
  
    <div class="form-group">
      <label for="title">Title</label>
      <input [(ngModel)]="note.title" type="text" id="title" class="form-input" />
    </div>
  
    <div class="form-group">
      <label for="content">Content</label>
      <textarea [(ngModel)] = "note.content" id="content" rows="5" class="form-input"></textarea>
    </div>
  
    <div class="actions">
      <button class="save-btn" (click) = "saveNote()">💾 Save</button>
      <button class="delete-btn" (click) = "deleteNote(note)">🗑 Delete</button>
      <button class="back-btn" (click) = "goBack()">↩ Back</button>
    </div>
  </div>

</div>
